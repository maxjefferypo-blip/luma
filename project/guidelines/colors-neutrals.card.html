<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.k{font:var(--text-caption);color:var(--text-tertiary)}.m{font:12px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-tertiary)}.g{display:grid;gap:16px}.s{display:flex;gap:12px;align-items:center}.c{width:48px;height:48px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px rgba(31,35,38,.08);flex:none}.s b{display:block;font:500 14px/20px var(--font-body)}.s span{display:block}.g{grid-template-columns:repeat(3,1fr)}</style></head><body><div class="g"><div class="s"><div class="c" style="background:var(--luma-ink-80)"></div><div><b>Ink 80</b><span class="m">--luma-ink-80</span><span class="m">#4A4C4D</span></div></div><div class="s"><div class="c" style="background:var(--luma-ink-64)"></div><div><b>Ink 64</b><span class="m">--luma-ink-64</span><span class="m">#6C6D6D</span></div></div><div class="s"><div class="c" style="background:var(--luma-ink-24)"></div><div><b>Ink 24</b><span class="m">--luma-ink-24</span><span class="m">#C2C0BB</span></div></div><div class="s"><div class="c" style="background:var(--luma-ink-14)"></div><div><b>Ink 14</b><span class="m">--luma-ink-14</span><span class="m">#D7D4CF</span></div></div><div class="s"><div class="c" style="background:var(--luma-bone-70)"></div><div><b>Bone 70</b><span class="m">--luma-bone-70</span><span class="m">#B5B3AF</span></div></div><div class="s"><div class="c" style="background:var(--luma-white)"></div><div><b>White</b><span class="m">--luma-white</span><span class="m">#FFFFFF</span></div></div></div></body></html>
