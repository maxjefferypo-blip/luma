<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.k{font:var(--text-caption);color:var(--text-tertiary)}.m{font:12px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-tertiary)}.r{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;background:var(--bg-subtle);margin:-24px;padding:32px}.r div{height:96px;border-radius:var(--radius-md);background:var(--bg-page);display:flex;align-items:flex-end;padding:12px}</style></head><body><div class="r"><div><span class="m">flat · no border</span></div><div style="box-shadow:inset 0 0 0 1px var(--border-hairline)"><span class="m">--border-hairline 1px</span></div><div style="box-shadow:var(--shadow-overlay)"><span class="m">--shadow-overlay</span></div></div></body></html>
