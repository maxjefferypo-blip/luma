<!-- @dsCard group="Colors" viewport="700x150" name="Accent & states" subtitle="Orange carries interaction; deeper tones only for hover, press, error" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.k{font:var(--text-caption);color:var(--text-tertiary)}.m{font:12px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-tertiary)}.g{display:grid;gap:16px}.s{display:flex;gap:12px;align-items:center}.c{width:48px;height:48px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px rgba(31,35,38,.08);flex:none}.s b{display:block;font:500 14px/20px var(--font-body)}.s span{display:block}.g{grid-template-columns:repeat(3,1fr)}</style></head><body><div class="g"><div class="s"><div class="c" style="background:var(--accent)"></div><div><b>Accent</b><span class="m">--accent</span><span class="m">#D65D42</span></div></div><div class="s"><div class="c" style="background:var(--accent-hover)"></div><div><b>Hover</b><span class="m">--accent-hover</span><span class="m">#C2533A</span></div></div><div class="s"><div class="c" style="background:var(--accent-press)"></div><div><b>Press</b><span class="m">--accent-press</span><span class="m">#AD4A33</span></div></div><div class="s"><div class="c" style="background:var(--accent-soft)"></div><div><b>Soft</b><span class="m">--accent-soft</span><span class="m">#F5BFA9</span></div></div><div class="s"><div class="c" style="background:var(--state-error)"></div><div><b>Error</b><span class="m">--state-error</span><span class="m">#B4442E</span></div></div><div class="s"><div class="c" style="background:var(--state-success)"></div><div><b>Success</b><span class="m">--state-success</span><span class="m">#1F2326</span></div></div></div></body></html>
