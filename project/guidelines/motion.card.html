<!-- @dsCard group="Spacing" viewport="700x170" name="Motion" subtitle="Fades and short rises. No bounce, no spin" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.k{font:var(--text-caption);color:var(--text-tertiary)}.m{font:12px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-tertiary)}.r{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.r div{border-top:1px solid var(--border-hairline);padding-top:12px}.r b{display:block;font:500 14px/20px var(--font-body);margin-bottom:4px}.dot{width:14px;height:14px;border-radius:50%;background:var(--luma-orange);margin-top:14px;animation:mv 2.4s var(--ease-out) infinite alternate}@keyframes mv{from{transform:translateX(0);opacity:.35}to{transform:translateX(160px);opacity:1}}</style></head><body><div class="r"><div><b>160ms · fast</b><span class="k">Hover, colour, underline</span></div><div><b>240ms · base</b><span class="k">Menus, accordions, toggles</span></div><div><b>480ms · slow</b><span class="k">Drawers, page reveals</span></div></div><div class="dot"></div><span class="m">--ease-out cubic-bezier(.2,.7,.2,1)</span></body></html>
