<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page);color:var(--text-primary)}.k{font:var(--text-caption);color:var(--text-tertiary)}.o{font:var(--text-overline);letter-spacing:var(--type-overline-track);text-transform:uppercase;color:var(--text-tertiary)}.d{font-family:var(--font-display);font-weight:400;letter-spacing:-.025em}.r{display:grid;grid-template-columns:72px minmax(0,1fr) 150px;gap:16px;align-items:baseline;padding:14px 0;border-top:1px solid var(--border-hairline)}.r:last-child{border-bottom:1px solid var(--border-hairline)}</style></head><body><div class="r"><span class="o">1 · Brand</span><span class="d" style="font-size:40px;line-height:44px">Light, reimagined.</span><span class="k">The recognisable idea</span></div>
<div class="r"><span class="o">2 · Product</span><span class="d" style="font-size:30px;line-height:34px">A different kind of screen protector.</span><span class="k">The curiosity hook</span></div>
<div class="r"><span class="o">3 · Explain</span><span class="d" style="font-size:24px;line-height:28px">Not just protection. Light conversion.</span><span class="k">The mechanism · conditional</span></div>
<div class="r"><span class="o">4 · Proof</span><span class="d" style="font-size:24px;line-height:28px">Measured, not assumed.</span><span class="k">Results, methods, limits</span></div></body></html>
