<!-- @dsCard group="Colors" viewport="700x260" name="Semantic surfaces & text" subtitle="Use aliases, not raw colours" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.k{font:var(--text-caption);color:var(--text-tertiary)}.m{font:12px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-tertiary)}.r{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.t{border-radius:var(--radius-md);padding:16px;height:128px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:inset 0 0 0 1px var(--border-hairline)}.t p{font:var(--text-body)}.t .m{color:inherit;opacity:.7}.l{display:flex;gap:24px;margin-top:16px}.l div{flex:1}.l i{display:block;height:0;border-top:1px solid;margin-bottom:8px}</style></head><body><div class="r"><div class="t" style="background:var(--bg-page);color:var(--text-primary)"><p>Page</p><span class="m">--bg-page</span></div><div class="t" style="background:var(--bg-subtle);color:var(--text-primary)"><p>Subtle</p><span class="m">--bg-subtle</span></div><div class="t" style="background:var(--bg-cool);color:var(--text-primary)"><p>Cool</p><span class="m">--bg-cool</span></div><div class="t" style="background:var(--bg-inverse);color:var(--text-inverse)"><p>Inverse</p><span class="m">--bg-inverse</span></div></div>
<div class="l"><div><p style="font:var(--text-body);color:var(--text-primary)">Primary</p><span class="m">--text-primary</span></div><div><p style="font:var(--text-body);color:var(--text-secondary)">Secondary</p><span class="m">--text-secondary</span></div><div><p style="font:var(--text-body);color:var(--text-tertiary)">Tertiary</p><span class="m">--text-tertiary</span></div><div><i style="border-color:var(--border-hairline)"></i><span class="m">--border-hairline</span></div><div><i style="border-color:var(--border-strong)"></i><span class="m">--border-strong</span></div></div></body></html>
