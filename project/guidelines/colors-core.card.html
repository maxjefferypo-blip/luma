<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-page)}.k{font:var(--text-caption);color:var(--text-tertiary)}.m{font:12px/16px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-tertiary)}.g{display:grid;gap:16px}.s{display:flex;gap:12px;align-items:center}.c{width:48px;height:48px;border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px rgba(31,35,38,.08);flex:none}.s b{display:block;font:500 14px/20px var(--font-body)}.s span{display:block}.g{grid-template-columns:repeat(3,1fr)}</style></head><body><div class="g"><div class="s"><div class="c" style="background:var(--luma-charcoal)"></div><div><b>Charcoal</b><span class="m">--luma-charcoal</span><span class="m">#1F2326</span></div></div><div class="s"><div class="c" style="background:var(--luma-orange)"></div><div><b>Luma Orange</b><span class="m">--luma-orange</span><span class="m">#D65D42</span></div></div><div class="s"><div class="c" style="background:var(--luma-peach)"></div><div><b>Luma Peach</b><span class="m">--luma-peach</span><span class="m">#F5BFA9</span></div></div><div class="s"><div class="c" style="background:var(--luma-bone)"></div><div><b>Bone</b><span class="m">--luma-bone</span><span class="m">#F5F1EA</span></div></div><div class="s"><div class="c" style="background:var(--luma-stone)"></div><div><b>Stone</b><span class="m">--luma-stone</span><span class="m">#E6DED3</span></div></div><div class="s"><div class="c" style="background:var(--luma-mist)"></div><div><b>Mist</b><span class="m">--luma-mist</span><span class="m">#D9E1DE</span></div></div></div></body></html>
